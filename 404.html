<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Abhay Kumar</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap" style="padding-block: 18vh;">
    <p class="eyebrow">404</p>
    <h1 style="font-size: clamp(2.4rem, 7vw, 4rem);">Page not found</h1>
    <p class="role">There is nothing at this address. <a href="/">Go to the home page</a>.</p>
  </main>
</body>
</html>
